<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Intelli-Prompt Pro Library</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Font: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Google Material Symbols (Icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }

        /* Use Montserrat font */
        body {
            font-family: 'Montserrat', sans-serif;
        }

        /* Style for Google Icons */
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
            vertical-align: middle; /* Helps align icons with text */
            flex-shrink: 0; /* Prevent icons from shrinking in flex layouts */
        }
        
        /* Style for FILLED star icon */
        .material-symbols-outlined.is-favorite {
            font-variation-settings: 'FILL' 1, 'wght' 500;
        }

        /* Style for the select dropdown arrows */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        /* Simple toast notification style */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px); /* Start off-screen */
            padding: 12px 24px;
            background-color: #22c55e; /* green-500 */
            color: white;
            border-radius: 9999px; /* rounded-full */
            opacity: 0;
            transition: all 0.3s ease-in-out;
            z-index: 100;
            font-weight: 500;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Tag Modal Styles */
        #tag-modal {
            transition: opacity 0.3s ease;
        }
        #tag-modal-panel {
            transition: all 0.3s ease;
            transform: translateY(1rem);
            opacity: 0;
        }
        #tag-modal.is-open {
            opacity: 1;
            pointer-events: auto;
        }
        #tag-modal.is-open #tag-modal-panel {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Tag pill styles in modal */
        .tag-pill {
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag-pill.is-active {
            background-color: #2563eb; /* blue-600 */
            color: #fff;
            font-weight: 600;
        }

        /* List View Card Styles */
        /* By default, card is grid */
        .snippet-card {
            display: flex;
            flex-direction: column;
        }
        
        /* This was the fix: Remove the CSS that was hiding all the card content in list view. */
        /* Now, "list-card" class is only used as a selector, not to apply styles. */
        
        /* NEW CSS for compact list view */
        .list-view-card [data-field="code-container"],
        .list-view-card [data-field="tags-container"] {
            display: none;
        }
        .list-view-card [data-field="description-container"],
        .list-view-card [data-field="use-cases-container"],
        .list-view-card [data-field="group-container"] {
            padding-top: 0.75rem; /* 12px */
            padding-bottom: 0.75rem; /* 12px */
        }
        /* END NEW CSS */
        
        /* Color-coded group classes */
        .group-color-1 { border-left-color: #3b82f6; } /* blue-500 */
        .group-color-2 { border-left-color: #10b981; } /* emerald-500 */
        .group-color-3 { border-left-color: #f97316; } /* orange-500 */
        .group-color-4 { border-left-color: #ec4899; } /* pink-500 */
        .group-color-5 { border-left-color: #8b5cf6; } /* violet-500 */
        .group-color-6 { border-left-color: #f59e0b; } /* amber-500 */
        .group-color-7 { border-left-color: #ef4444; } /* red-500 */
        .group-color-8 { border-left-color: #06b6d4; } /* cyan-500 */
        .group-color-default { border-left-color: #6b7280; } /* gray-500 */

    </style>
</head>
<body class="h-full text-gray-100">
    <div class="flex flex-col h-full">
        <!-- Header -->
        <header id="app-header" class="bg-gray-800 shadow-md p-4 sticky top-0 z-20 h-20 flex items-center">
            <div class="container mx-auto max-w-7xl flex justify-between items-center gap-4">
                <div class="flex-shrink-0">
                    <h1 class="text-xl md:text-2xl font-bold text-white">GPT Intelli-Prompt Pro</h1>
                    <p class="text-sm text-gray-400 hidden md:block">Search, filter, and browse your custom prompt snippets.</p>
                </div>
                <!-- Header Controls -->
                <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                    <!-- Grid/List Toggle -->
                    <div class="hidden md:flex items-center gap-1 bg-gray-700 p-1 rounded-lg">
                        <button id="view-grid-btn" class="p-1.5 rounded-md text-white bg-blue-600" title="Grid View">
                            <span class="material-symbols-outlined">grid_view</span>
                        </button>
                        <button id="view-list-btn" class="p-1.5 rounded-md text-gray-400 hover:text-white" title="List View">
                            <span class="material-symbols-outlined">view_list</span>
                        </button>
                    </div>
                    <!-- Mobile Filter Toggle Button -->
                    <button id="toggle-filter-btn" class="md:hidden flex items-center gap-1.5 p-2 rounded-md bg-blue-600 text-white hover:bg-blue-700 transition-colors">
                        <span id="filter-btn-icon" class="material-symbols-outlined">filter_list</span>
                        <span id="filter-btn-text" class="font-medium">Filters</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Controls: Search and Filters -->
        <div id="filter-container" class="hidden md:block bg-gray-800 border-t border-gray-700 p-4 md:sticky top-20 z-10">
            <div class="container mx-auto max-w-7xl">
                <!-- Row 1: Search & Group -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Search Input -->
                    <div>
                        <label for="search" class="block text-sm font-medium text-gray-300 mb-1">Search</label>
                        <div class="relative">
                            <input type="text" id="search" placeholder="Search by name, trigger, description..." class="w-full bg-gray-700 text-white rounded-md border-gray-600 focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5" disabled>
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-gray-400">search</span>
                            </div>
                        </div>
                    </div>
                    <!-- Group Filter -->
                    <div>
                        <label for="group-filter" class="block text-sm font-medium text-gray-300 mb-1">Filter by Group</label>
                        <select id="group-filter" class="w-full bg-gray-700 text-white rounded-md border-gray-600 focus:ring-blue-500 focus:border-blue-500 p-2.5" disabled>
                            <option value="all">All Groups</option>
                        </select>
                    </div>
                </div>
                <!-- Row 2: Sort, Tags, Favorites -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <!-- Sort By -->
                    <div>
                        <label for="sort-by" class="block text-sm font-medium text-gray-300 mb-1">Sort By</label>
                        <select id="sort-by" class="w-full bg-gray-700 text-white rounded-md border-gray-600 focus:ring-blue-500 focus:border-blue-500 p-2.5" disabled>
                            <option value="default">Default (YAML Order)</option>
                            <option value="newest">Newest (ID)</option>
                            <option value="oldest">Oldest (ID)</option>
                            <option value="alphabetical">Alphabetical (A-Z)</option>
                        </select>
                    </div>
                    <!-- Tag Filter Button -->
                    <div>
                        <label for="tag-filter-btn" class="block text-sm font-medium text-gray-300 mb-1">Filter by Tag</label>
                        <button id="tag-filter-btn" class="w-full text-left bg-gray-700 text-white rounded-md border-gray-600 focus:ring-blue-500 focus:border-blue-500 p-2.5 flex justify-between items-center" disabled>
                            <span id="tag-filter-btn-text">All Tags</span>
                            <span class="material-symbols-outlined text-gray-400">arrow_drop_down</span>
                        </button>
                    </div>
                    <!-- Favorites Toggle -->
                    <div>
                        <label for="favorites-toggle" class="block text-sm font-medium text-gray-300 mb-1">Favorites</label>
                        <label for="favorites-toggle" class="flex items-center w-full bg-gray-700 rounded-md border-gray-600 p-2.5 h-[42px] cursor-pointer">
                            <div class="relative">
                                <input type="checkbox" id="favorites-toggle" class="sr-only" disabled>
                                <div class="block bg-gray-600 w-10 h-6 rounded-full"></div>
                                <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                            </div>
                            <span class="ml-3 text-white font-medium">Show Favorites Only</span>
                        </label>
                        <!-- Custom toggle switch CSS -->
                        <style>
                            input:checked ~ .dot {
                                transform: translateX(100%);
                            }
                            input:checked ~ .block {
                                background-color: #2563eb; /* blue-600 */
                            }
                        </style>
                    </div>
                </div>
            </div>
        </div>

        <!-- Snippet Container -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <div id="status-container" class="container mx-auto max-w-7xl text-center text-gray-400 p-10">
                <!-- This will show loading or error messages -->
            </div>
            <div id="snippet-container" class="container mx-auto max-w-7xl gap-4 md:gap-6">
                <!-- Snippet cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Copied to clipboard!</div>

    <!-- Tag Filter Modal -->
    <div id="tag-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none">
        <div id="tag-modal-panel" class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-2xl max-h-[70vh] flex flex-col">
            <header class="flex justify-between items-center p-4 border-b border-gray-700">
                <h3 class="text-xl font-semibold text-white">Filter by Tag</h3>
                <button id="close-tag-modal-btn" class="text-gray-400 hover:text-white">
                    <span class="material-symbols-outlined text-3xl">close</span>
                </button>
            </header>
            <div id="tag-modal-list" class="p-6 overflow-y-auto flex flex-wrap gap-2">
                <!-- Tag pills will be injected here -->
            </div>
            <footer class="p-4 bg-gray-800 border-t border-gray-700 flex justify-end items-center gap-3">
                <button id="clear-tags-btn" class="px-4 py-2 rounded-md text-white font-medium bg-gray-600 hover:bg-gray-500 transition-colors">Clear All</button>
                <button id="apply-tags-btn" class="px-4 py-2 rounded-md text-white font-medium bg-blue-600 hover:bg-blue-700 transition-colors">Apply Filters</button>
            </footer>
        </div>
    </div>

    <!-- Snippet Card Template -->
    <template id="snippet-card-template">
        <div class="snippet-card bg-gray-800 rounded-lg shadow-lg overflow-hidden flex flex-col transition-all duration-300 border-l-4">
            <!-- Card Header -->
            <div class="p-4 border-b border-gray-700">
                <div class="flex justify-between items-start gap-3">
                    <h3 class="text-lg font-semibold text-white" data-field="name">Snippet Name</h3>
                    <button data-field="favorite-btn" class="text-gray-500 hover:text-amber-400 transition-colors" title="Add to favorites">
                        <span class="material-symbols-outlined">star</span>
                    </button>
                </div>
                 <div class="flex justify-between items-center mt-2">
                    <code class="text-sm bg-gray-700 text-blue-300 px-2 py-1 rounded-md whitespace-nowrap" data-field="trigger">:trigger</code>
                </div>
            </div>
            
            <div data-field="group-container" class="p-4 bg-gray-800 border-b border-gray-700">
                 <p class="text-sm text-gray-400 font-medium" data-field="group">Group Name</p>
            </div>
            
            <!-- Card Body -->
            <div data-field="description-container" class="p-4 flex-1">
                <p class="text-sm text-gray-300 mb-3" data-field="description">Description goes here.</p>
            </div>
            
            <div data-field="use-cases-container" class="p-4 flex-1 border-t border-gray-700">
                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">Use Cases</h4>
                <div class="flex flex-wrap gap-1.5" data-field="use-cases">
                    <!-- Use case tags will be injected here -->
                </div>
            </div>

            <!-- Code Block -->
            <div data-field="code-container" class="p-4 bg-gray-800 border-t border-gray-700">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase">Snippet Content</h4>
                    <button class="copy-btn flex items-center gap-1.5 text-sm text-gray-400 hover:text-white transition-colors rounded-md p-1 -m-1">
                        <span class="material-symbols-outlined text-sm">content_copy</span>
                        Copy
                    </button>
                </div>
                <pre class="bg-gray-900 text-gray-200 p-3 rounded-md text-sm overflow-x-auto"><code data-field="replace">...</code></pre>
            </div>
            
            <!-- Card Footer (Tags) -->
            <div data-field="tags-container" class="p-4 border-t border-gray-700">
                <h4 class="text-xs font-semibold text-gray-400 uppercase mb-2">Tags</h4>
                <div class="flex flex-wrap gap-2" data-field="tags">
                    <!-- Tags will be injected here -->
                </div>
            </div>
        </div>
    </template>

    <script>
        // --- GLOBAL STATE ---
        let allSnippets = [];
        let allTags = new Set();
        let allGroups = new Set();
        let favoriteSnippets = new Set();
        let selectedTags = [];
        let currentView = 'grid'; // 'grid' or 'list'
        
        // Group colors for consistent mapping
        const groupColorMap = new Map();
        const groupColors = [
            'group-color-1', 'group-color-2', 'group-color-3', 'group-color-4',
            'group-color-5', 'group-color-6', 'group-color-7', 'group-color-8',
        ];

        // --- DOM ELEMENTS ---
        const snippetContainer = document.getElementById('snippet-container');
        const statusContainer = document.getElementById('status-container');
        const searchInput = document.getElementById('search');
        const groupFilter = document.getElementById('group-filter');
        const sortBy = document.getElementById('sort-by');
        const favoritesToggle = document.getElementById('favorites-toggle');
        const tagFilterBtn = document.getElementById('tag-filter-btn');
        const tagFilterBtnText = document.getElementById('tag-filter-btn-text');
        
        // Mobile filter toggle
        const toggleFilterBtn = document.getElementById('toggle-filter-btn');
        const filterContainer = document.getElementById('filter-container');
        const filterBtnIcon = document.getElementById('filter-btn-icon');
        const filterBtnText = document.getElementById('filter-btn-text');

        // View toggle buttons
        const viewGridBtn = document.getElementById('view-grid-btn');
        const viewListBtn = document.getElementById('view-list-btn');

        // Tag Modal
        const tagModal = document.getElementById('tag-modal');
        const tagModalList = document.getElementById('tag-modal-list');
        const closeTagModalBtn = document.getElementById('close-tag-modal-btn');
        const clearTagsBtn = document.getElementById('clear-tags-btn');
        const applyTagsBtn = document.getElementById('apply-tags-btn');
        
        // Card Template
        const snippetCardTemplate = document.getElementById('snippet-card-template');
        
        // Toast Notification
        const toast = document.getElementById('toast');
        let toastTimeout;

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            loadFavorites();
            setupEventListeners();
        });

        /**
         * Fetches and parses the YAML data
         */
        async function loadData() {
            showStatus('Loading snippets...', true);
            
            const yamlUrl = 'https://machupicchu.lt/projects/espanso/gpt-intelli-prompt-pro.yml';
            // Using corsproxy.io as the proxy
            const proxyUrl = 'https://corsproxy.io/?';
            const fetchUrl = `${proxyUrl}${encodeURIComponent(yamlUrl)}`;
            
            try {
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    throw new Error(`Load failed with status: ${response.status}`);
                }
                const yamlText = await response.text();
                
                allSnippets = parseYaml(yamlText);
                
                if (allSnippets.length === 0) {
                    showStatus('Could not parse any snippets from the file.');
                    return;
                }
                
                populateFilters();
                enableControls();
                applyStateFromURL(); // This will also trigger the first render
                
                showStatus('', false); // Clear loading message

            } catch (error) {
                console.error('Error loading snippets:', error);
                showStatus(`Error loading snippets: ${error.message}. Please check the console and ensure the YAML URL is accessible.`);
            }
        }

        /**
         * Loads favorites from localStorage
         */
        function loadFavorites() {
            const storedFavorites = localStorage.getItem('gptPromptFavorites');
            if (storedFavorites) {
                favoriteSnippets = new Set(JSON.parse(storedFavorites));
            }
        }
        
        /**
         * Saves favorites to localStorage
         */
        function saveFavorites() {
            localStorage.setItem('gptPromptFavorites', JSON.stringify(Array.from(favoriteSnippets)));
        }

        /**
         * Sets up all event listeners for the app
         */
        function setupEventListeners() {
            // Filter controls
            searchInput.addEventListener('input', () => filterAndRender(true));
            groupFilter.addEventListener('change', () => filterAndRender(true));
            sortBy.addEventListener('change', () => filterAndRender(true));
            favoritesToggle.addEventListener('change', () => filterAndRender(true));

            // View toggle
            viewGridBtn.addEventListener('click', () => setView('grid'));
            viewListBtn.addEventListener('click', () => setView('list'));

            // Mobile filter toggle
            toggleFilterBtn.addEventListener('click', () => {
                const isOpen = filterContainer.classList.toggle('hidden');
                filterContainer.classList.toggle('md:block', !isOpen); // Ensure md:block is re-added if it was removed
                
                if (isOpen) {
                    filterBtnIcon.textContent = 'filter_list';
                    filterBtnText.textContent = 'Filters';
                } else {
                    filterBtnIcon.textContent = 'close';
                    filterBtnText.textContent = 'Close';
                }
            });

            // Tag Modal
            tagFilterBtn.addEventListener('click', openTagModal);
            closeTagModalBtn.addEventListener('click', closeTagModal);
            tagModal.addEventListener('click', (e) => {
                if (e.target === tagModal) closeTagModal();
            });
            clearTagsBtn.addEventListener('click', () => {
                selectedTags = [];
                updateTagModalPills();
                filterAndRender(true);
                closeTagModal();
            });
            applyTagsBtn.addEventListener('click', () => {
                // Selection is already updated live, just close modal and render
                filterAndRender(true);
                closeTagModal();
            });
        }
        
        /**
         * Enables all form controls after data is loaded
         */
        function enableControls() {
            [searchInput, groupFilter, sortBy, favoritesToggle, tagFilterBtn].forEach(el => {
                el.disabled = false;
            });
        }
        
        /**
         * Parses the raw YAML text into a structured array of snippet objects
         */
        function parseYaml(yamlText) {
            const lines = yamlText.split('\n');
            const snippets = [];
            let currentSnippet = null;
            let currentGroup = 'Uncategorized';
            let metadata = {};

            const metadataRegex = /#\s*([a-z\s]+):\s*(.+)/i;
            const groupRegex = /# Group Name:\s*(.+)/i;
            const triggerRegex = /-\s*trigger:\s*"(.*)"/;
            const replaceRegex = /replace:\s*\|?/; // Matches start of replace block

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Check for Group Name
                const groupMatch = line.match(groupRegex);
                if (groupMatch) {
                    currentGroup = groupMatch[1].trim();
                    if (!groupColorMap.has(currentGroup)) {
                        groupColorMap.set(currentGroup, groupColors[groupColorMap.size % groupColors.length] || 'group-color-default');
                    }
                    continue;
                }

                // Check for metadata
                const metadataMatch = line.match(metadataRegex);
                if (metadataMatch) {
                    const key = metadataMatch[1].trim().toLowerCase().replace(' ', '-');
                    const value = metadataMatch[2].trim();
                    metadata[key] = value;
                    continue;
                }

                // Check for trigger (start of a new snippet)
                const triggerMatch = line.match(triggerRegex);
                if (triggerMatch) {
                    // If we were processing a snippet, push it
                    if (currentSnippet) {
                        snippets.push(currentSnippet);
                    }
                    
                    // Start new snippet
                    currentSnippet = {
                        trigger: triggerMatch[1],
                        group: currentGroup,
                        ...metadata,
                        replace: '',
                        id: metadata.name ? (parseInt(metadata.name.match(/ID(\d+)/)?.[1]) || 0) : 0
                    };
                    
                    // Clean up metadata for next snippet
                    metadata = {};
                    continue;
                }

                // Check for replace block
                if (currentSnippet && line.match(replaceRegex)) {
                    // Check if it's a single line replace
                    const singleLineReplace = line.match(/replace:\s*"(.*)"/);
                    if(singleLineReplace) {
                        currentSnippet.replace = singleLineReplace[1].replace(/\\n/g, '\n');
                    } else {
                        // It's a multi-line block
                        let j = i + 1;
                        let replaceBlock = [];
                        while (j < lines.length && (lines[j].startsWith('      ') || lines[j].trim() === '')) {
                            replaceBlock.push(lines[j].substring(6)); // Remove indentation
                            j++;
                        }
                        currentSnippet.replace = replaceBlock.join('\n').trim();
                        i = j - 1; // Move parser to end of replace block
                    }
                    continue;
                }
            }
            
            // Push the last snippet
            if (currentSnippet) {
                snippets.push(currentSnippet);
            }

            return snippets.map(s => {
                // Post-process tags and use cases
                s.tags = s.tags ? s.tags.split(',').map(t => t.trim()) : [];
                s['use-cases'] = s['use-cases'] ? s['use-cases'].split(',').map(t => t.trim()) : [];
                
                // Add tags and groups to global sets
                s.tags.forEach(tag => allTags.add(tag));
                allGroups.add(s.group);
                
                return s;
            });
        }
        
        /**
         * Populates the filter dropdowns with unique tags and groups
         */
        function populateFilters() {
            // Populate Group filter
            Array.from(allGroups).sort().forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                groupFilter.appendChild(option);
            });

            // Populate Tag Modal
            Array.from(allTags).sort().forEach(tag => {
                const tagPill = document.createElement('button');
                tagPill.className = 'tag-pill bg-gray-700 text-gray-200 px-3 py-1.5 rounded-full text-sm font-medium hover:bg-gray-600';
                tagPill.textContent = tag;
                tagPill.dataset.tag = tag;
                tagPill.addEventListener('click', () => toggleTagSelection(tag));
                tagModalList.appendChild(tagPill);
            });
        }

        /**
         * Reads the current filter values from the URL on page load
         */
        function applyStateFromURL() {
            const params = new URLSearchParams(window.location.search);
            
            searchInput.value = params.get('search') || '';
            groupFilter.value = params.get('group') || 'all';
            sortBy.value = params.get('sort') || 'default';
            favoritesToggle.checked = params.get('favorites') === 'true';
            
            selectedTags = params.get('tags')?.split(',').filter(Boolean) || [];
            updateTagModalPills();
            updateTagFilterButtonText();
            
            setView(params.get('view') || 'grid', false); // false = don't update URL

            filterAndRender(false); // false = don't update URL
        }

        /**
         * Updates the URL bar with the current filter state
         */
        function updateURLState() {
            const params = new URLSearchParams();
            
            if (searchInput.value) params.set('search', searchInput.value);
            if (groupFilter.value !== 'all') params.set('group', groupFilter.value);
            if (sortBy.value !== 'default') params.set('sort', sortBy.value);
            if (favoritesToggle.checked) params.set('favorites', 'true');
            if (selectedTags.length > 0) params.set('tags', selectedTags.join(','));
            if (currentView !== 'grid') params.set('view', currentView);

            const newQueryString = params.toString();
            // Get the full current URL without any existing query string
            const currentUrlWithoutQuery = window.location.href.split('?')[0];
            
            let newUrl = currentUrlWithoutQuery;
            if (newQueryString) {
                newUrl += `?${newQueryString}`;
            }
            
            // Only call replaceState if the URL is actually different
            if (newUrl !== window.location.href) {
                try {
                    window.history.replaceState(null, '', newUrl);
                } catch (e) {
                    console.warn("Could not update URL state. This can happen in sandboxed environments.", e);
                }
            }
        }
        
        // --- VIEW & RENDER FUNCTIONS ---
        
        /**
         * Sets the current view (grid or list)
         */
        function setView(view, doUpdateURL = true) {
            currentView = view;
            if (view === 'grid') {
                snippetContainer.classList.remove('flex', 'flex-col');
                snippetContainer.classList.add('grid', 'md:grid-cols-2', 'lg:grid-cols-3');
                viewGridBtn.classList.add('bg-blue-600', 'text-white');
                viewGridBtn.classList.remove('text-gray-400', 'hover:text-white');
                viewListBtn.classList.remove('bg-blue-600', 'text-white');
                viewListBtn.classList.add('text-gray-400', 'hover:text-white');
            } else { // 'list' view
                snippetContainer.classList.add('flex', 'flex-col');
                snippetContainer.classList.remove('grid', 'md:grid-cols-2', 'lg:grid-cols-3');
                viewListBtn.classList.add('bg-blue-600', 'text-white');
                viewListBtn.classList.remove('text-gray-400', 'hover:text-white');
                viewGridBtn.classList.remove('bg-blue-600', 'text-white');
                viewGridBtn.classList.add('text-gray-400', 'hover:text-white');
            }
            
            // This was the fix: Remove the part that toggles 'list-card'
            // The cards will now always be full-featured, and the container controls the layout.
            
            // This is the new part: toggle the compact class on all cards
            document.querySelectorAll('.snippet-card').forEach(card => {
                card.classList.toggle('list-view-card', view === 'list');
            });
            
            if (doUpdateURL) {
                updateURLState();
            }
        }

        /**
         * Main function to filter and re-render the snippet list
         */
        function filterAndRender(doUpdateURL = true) {
            let filtered = [...allSnippets];
            
            // 1. Get filter values
            const searchTerm = searchInput.value.toLowerCase();
            const selectedGroup = groupFilter.value;
            const sortMethod = sortBy.value;
            const showFavorites = favoritesToggle.checked;
            
            // 2. Apply filters
            // Favorites
            if (showFavorites) {
                filtered = filtered.filter(s => favoriteSnippets.has(s.id));
            }
            
            // Group
            if (selectedGroup !== 'all') {
                filtered = filtered.filter(s => s.group === selectedGroup);
            }
            
            // Tags (multi-select)
            if (selectedTags.length > 0) {
                filtered = filtered.filter(s => 
                    selectedTags.every(tag => s.tags.includes(tag))
                );
            }
            
            // Search
            if (searchTerm) {
                filtered = filtered.filter(s => 
                    s.name.toLowerCase().includes(searchTerm) ||
                    s.trigger.toLowerCase().includes(searchTerm) ||
                    s.description.toLowerCase().includes(searchTerm) ||
                    s.tags.some(t => t.toLowerCase().includes(searchTerm)) ||
                    s['use-cases'].some(t => t.toLowerCase().includes(searchTerm))
                );
            }
            
            // 3. Apply sorting
            if (sortMethod === 'alphabetical') {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMethod === 'newest') {
                filtered.sort((a, b) => b.id - a.id);
            } else if (sortMethod === 'oldest') {
                filtered.sort((a, b) => a.id - b.id);
            }
            // 'default' sorting is just the array order, so no-op.

            // 4. Render
            renderSnippets(filtered);
            
            // 5. Update URL
            if (doUpdateURL) {
                updateURLState();
            }
        }
        
        /**
         * Renders the given snippets to the DOM
         */
        function renderSnippets(snippets) {
            snippetContainer.innerHTML = ''; // Clear existing
            
            if (snippets.length === 0) {
                showStatus('No snippets found. Try adjusting your search or filters.', false);
                return;
            }
            
            showStatus('', false); // Clear any status messages
            
            const fragment = document.createDocumentFragment();
            snippets.forEach(snippet => {
                fragment.appendChild(createSnippetCard(snippet));
            });
            snippetContainer.appendChild(fragment);
            
            // Ensure container layout matches current view
            setView(currentView, false);
        }

        /**
         * Creates a single snippet card element
         */
        function createSnippetCard(snippet) {
            const card = snippetCardTemplate.content.cloneNode(true).firstElementChild;
            
            // Get fields
            const nameEl = card.querySelector('[data-field="name"]');
            const triggerEl = card.querySelector('[data-field="trigger"]');
            const groupEl = card.querySelector('[data-field="group"]');
            const descriptionEl = card.querySelector('[data-field="description"]');
            const useCasesEl = card.querySelector('[data-field="use-cases"]');
            const replaceEl = card.querySelector('[data-field="replace"]');
            const tagsEl = card.querySelector('[data-field="tags"]');
            const copyBtn = card.querySelector('.copy-btn');
            const favoriteBtn = card.querySelector('[data-field="favorite-btn"]');
            
            // Populate data
            nameEl.textContent = snippet.name;
            triggerEl.textContent = snippet.trigger;
            groupEl.textContent = snippet.group;
            descriptionEl.textContent = snippet.description;
            replaceEl.textContent = snippet.replace;
            
            // Group Color
            const groupColorClass = groupColorMap.get(snippet.group) || 'group-color-default';
            card.classList.add(groupColorClass);
            
            // Populate Use Cases
            useCasesEl.innerHTML = '';
            if (snippet['use-cases'] && snippet['use-cases'].length > 0) {
                snippet['use-cases'].forEach(useCase => {
                    const pill = document.createElement('span');
                    pill.className = 'bg-gray-700 text-gray-200 px-2 py-0.5 rounded-full text-xs font-medium';
                    pill.textContent = useCase;
                    useCasesEl.appendChild(pill);
                });
            } else {
                 useCasesEl.innerHTML = '<span class="text-xs text-gray-500 italic">No use cases listed.</span>';
            }
            
            // Populate Tags
            tagsEl.innerHTML = '';
            if (snippet.tags && snippet.tags.length > 0) {
                snippet.tags.forEach(tag => {
                    const pill = document.createElement('span');
                    pill.className = 'bg-blue-900/50 text-blue-200 px-2 py-0.5 rounded-full text-xs font-medium';
                    pill.textContent = tag;
                    tagsEl.appendChild(pill);
                });
            } else {
                tagsEl.innerHTML = '<span class="text-xs text-gray-500 italic">No tags listed.</span>';
            }

            // Add copy functionality
            copyBtn.addEventListener('click', () => {
                // Fallback for non-clipboard API environments
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = snippet.replace;
                    textarea.style.position = 'fixed'; // Prevent scrolling to bottom
                    textarea.style.opacity = 0;
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('Copied to clipboard!');
                } catch (err) {
                    console.error('Fallback copy failed', err);
                    showToast('Failed to copy!', true);
                }
            });
            
            // Favorite functionality
            const starIcon = favoriteBtn.querySelector('.material-symbols-outlined');
            if (favoriteSnippets.has(snippet.id)) {
                starIcon.classList.add('is-favorite', 'text-amber-400');
            }
            
            favoriteBtn.addEventListener('click', () => {
                if (favoriteSnippets.has(snippet.id)) {
                    favoriteSnippets.delete(snippet.id);
                    starIcon.classList.remove('is-favorite', 'text-amber-400');
                    showToast('Removed from favorites', false);
                } else {
                    favoriteSnippets.add(snippet.id);
                    starIcon.classList.add('is-favorite', 'text-amber-400');
                    showToast('Added to favorites!', false);
                }
                saveFavorites();
                
                // If "Show Favorites" is toggled, re-render the list
                if (favoritesToggle.checked) {
                    filterAndRender(true);
                }
            });

            return card;
        }

        /**
         * Shows or hides the main status message
         */
        function showStatus(message, isLoading = false) {
            if (!message) {
                statusContainer.innerHTML = '';
                statusContainer.classList.add('hidden');
                snippetContainer.classList.remove('hidden');
                return;
            }
            
            statusContainer.classList.remove('hidden');
            snippetContainer.classList.add('hidden');
            
            let loadingIcon = isLoading 
                ? '<div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>' 
                : '';
            
            statusContainer.innerHTML = `
                ${loadingIcon}
                <p class="text-lg">${message}</p>
            `;
        }
        
        /**
         * Shows a temporary toast notification
         */
        function showToast(message, isError = false) {
            clearTimeout(toastTimeout);
            toast.textContent = message;
            toast.className = `show ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            
            toastTimeout = setTimeout(() => {
                toast.className = '';
            }, 3000);
        }

        // --- TAG MODAL FUNCTIONS ---

        function openTagModal() {
            tagModal.classList.remove('opacity-0', 'pointer-events-none');
            tagModal.classList.add('is-open');
        }

        function closeTagModal() {
            tagModal.classList.add('opacity-0', 'pointer-events-none');
            tagModal.classList.remove('is-open');
        }

        function toggleTagSelection(tag) {
            const index = selectedTags.indexOf(tag);
            if (index > -1) {
                selectedTags.splice(index, 1);
            } else {
                selectedTags.push(tag);
            }
            updateTagModalPills();
        }

        function updateTagModalPills() {
            tagModalList.querySelectorAll('.tag-pill').forEach(pill => {
                if (selectedTags.includes(pill.dataset.tag)) {
                    pill.classList.add('is-active');
                } else {
                    pill.classList.remove('is-active');
                }
            });
            updateTagFilterButtonText();
        }

        function updateTagFilterButtonText() {
            if (selectedTags.length === 0) {
                tagFilterBtnText.textContent = 'All Tags';
            } else if (selectedTags.length === 1) {
                tagFilterBtnText.textContent = selectedTags[0];
            } else {
                tagFilterBtnText.textContent = `${selectedTags.length} tags selected`;
            }
        }
    </script>
</body>
