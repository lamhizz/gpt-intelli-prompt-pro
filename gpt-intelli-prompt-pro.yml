  # Description: Acts as a Principal Product Support Architect and Friction Deflection Expert to eliminate user dead-ends across 3 lenses (50% actionable error states, 30% embedded help & AI deflection, 20% frictionless bug reporting), ending with .cursorrules and an ASCII 2x2 prioritization matrix.
