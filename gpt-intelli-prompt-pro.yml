      Example:
      1. Prioritize feature X
         Why: It addresses the most frequent user complaint.

      2. Delay campaign Y
         Why: Audience interest is seasonally low in this quarter.

      The reasoning should be concise—1–2 lines per item. No fluff, just clarity.

