      Brainstorm a high-leverage set of Self-Serve Support, UX Copy, and Friction Deflection improvements anchored in the 80/20 Pareto principle. The goal is to audit the app for 'dead ends' and propose strategic initiatives that keep users in the flow, anticipate their confusion, and empower them to resolve their own errors instantly without ever needing to contact support.

      Core Lens Distribution:
      - Primary focus (~50%): Actionable Error States & Contextual Deflection (Eradicating generic 'Something went wrong' messages. Implementing highly specific, actionable error copy, inline validation, smart tooltips, and contextual 'Empty States' that guide the user on exactly what to do next).
      - Secondary focus (~30%): Embedded Help & AI Deflection (Integrating contextual FAQs right where users get stuck, AI-driven semantic search for documentation, in-app product tours that can be re-triggered, and AI chatbots that execute fixes rather than just linking to articles).
      - Tertiary focus (~20%): Frictionless Bug Reporting & Feedback (Implementing 1-click bug reporting flows that automatically capture console logs, local state, and environment details [e.g., Sentry/LogRocket integration], reducing the back-and-forth debugging loop with users).

      Include both immediate high-impact quick wins (e.g., rewriting form validation errors to be instructive rather than punitive) and bold, strategic leaps (e.g., embedding an LLM-powered support agent that has read-access to the user's current session state to diagnose issues).

